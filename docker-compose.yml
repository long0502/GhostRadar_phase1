services:
  db:
    image: postgres:15
    container_name: ghost_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-ghostradar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ghostradar}
      POSTGRES_DB: ${DB_NAME:-ghostradar}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ghostradar} -d ${DB_NAME:-ghostradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: ghost_api
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8088}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-ghostradar}
      DB_PASSWORD: ${DB_PASSWORD:-ghostradar}
      DB_NAME: ${DB_NAME:-ghostradar}
      DATABASE_URL: postgresql://${DB_USER:-ghostradar}:${DB_PASSWORD:-ghostradar}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-ghostradar}
      NODE_ENV: production
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - '8088:8088'
    volumes:
      - api_event_images:/app/storage/event-images
    depends_on:
      db:
        condition: service_healthy

  admin:
    build: ./apps/admin
    container_name: ghost_admin
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ghostradar}:${DB_PASSWORD:-ghostradar}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-ghostradar}
      JWT_SECRET: ${ADMIN_JWT_SECRET:-ghostradar-admin-secret-change-in-production}
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  api_event_images:
