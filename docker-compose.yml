version: '3.9'

services:
  db:
    image: postgres:15
    container_name: ghost_db
    restart: always
    environment:
      POSTGRES_USER: ghostradar
      POSTGRES_PASSWORD: ghostradar
      POSTGRES_DB: ghostradar
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostradar -d ghostradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    container_name: ghost_api
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://ghostradar:ghostradar@ghost_db:5432/ghostradar
      NODE_ENV: production
      PORT: 8088
    ports:
      - '8088:8088'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
